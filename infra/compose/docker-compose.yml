services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studyspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studyspace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studyspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis cache and Celery broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: studyspace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # FastAPI API service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: studyspace-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/studyspace
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../services/api/uploads:/app/uploads
    ports:
      - "8000:8000"

  # ----------------------------------------------------------------------------
  # Celery Ingestion Worker service
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: studyspace-worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/studyspace
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../services/api/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------------------------
  # Frontend Web service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-${SUPABASE_URL:-https://mexqshfhitgleybpdhqo.supabase.co}}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-${SUPABASE_ANON_KEY:-sb_publishable_oTKvk7BHBRZU3S0Dzp4dGw_8u5ii-Ka}}
        SUPABASE_URL: ${SUPABASE_URL:-https://mexqshfhitgleybpdhqo.supabase.co}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-sb_publishable_oTKvk7BHBRZU3S0Dzp4dGw_8u5ii-Ka}
    container_name: studyspace-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:8080"

volumes:
  postgres_data:
  redis_data:
